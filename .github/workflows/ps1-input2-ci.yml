name: PS1 Input 2.0 CI

on:
  push:
    branches: [ "agent/ps1-input2-compat" ]
    paths:
      - "app/src/main/cpp/**"
      - "app/src/main/java/com/omnicore/emulator/emulation/**"
      - "app/src/main/java/com/omnicore/emulator/settings/InputSettings.kt"
      - "app/src/main/java/com/omnicore/emulator/core/nativebridge/NativeBridge.kt"
      - "app/src/main/java/com/omnicore/emulator/core/ps1/**"
      - "app/src/main/java/com/omnicore/emulator/storage/Ps1MediaLayout.kt"
      - "app/src/main/java/com/omnicore/emulator/storage/Ps1MediaPreflight.kt"
      - "app/src/main/java/com/omnicore/emulator/storage/Ps1DiscManifest.kt"
      - "app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt"
      - "tools/patch_ps1_ui_disk.py"
      - ".github/workflows/ps1-input2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps1-input2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ps1-input2-compat

      - name: Guard legacy input contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SMART("smart"' app/src/main/java/com/omnicore/emulator/settings/InputSettings.kt
          grep -q 'NATIVE("native"' app/src/main/java/com/omnicore/emulator/settings/InputSettings.kt
          grep -q 'DPAD("dpad"' app/src/main/java/com/omnicore/emulator/settings/InputSettings.kt
          grep -q 'TANK_ASSIST("tank_assist"' app/src/main/java/com/omnicore/emulator/settings/InputSettings.kt
          grep -q 'TankMovementAssist' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'saveGameAnalogMode' app/src/main/java/com/omnicore/emulator/settings/InputSettings.kt
          grep -q 'clearGameAnalogMode' app/src/main/java/com/omnicore/emulator/settings/InputSettings.kt
          grep -q 'buttonPointerTargets' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          grep -q 'dpadProjectionCache' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt

      - name: Guard Smart Auto control routing
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/omnicore/emulator/emulation/Ps1ControlProfiles.kt
          grep -q 'legacy-hybrid' app/src/main/java/com/omnicore/emulator/emulation/Ps1ControlProfiles.kt
          grep -q 'resident-evil' app/src/main/java/com/omnicore/emulator/emulation/Ps1ControlProfiles.kt
          grep -q 'ape-escape' app/src/main/java/com/omnicore/emulator/emulation/Ps1ControlProfiles.kt
          grep -q 'applySmartAutoProfile' app/src/main/java/com/omnicore/emulator/settings/InputSettings.kt
          grep -q 'KEY_AUTO_ANALOG' app/src/main/java/com/omnicore/emulator/settings/InputSettings.kt
          grep -q 'Ps1ControlProfiles.recommend' app/src/main/java/com/omnicore/emulator/core/ps1/Ps1Core.kt
          grep -q 'recommendation.mode' app/src/main/java/com/omnicore/emulator/core/ps1/Ps1Core.kt

      - name: Guard PS1 media compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/omnicore/emulator/storage/Ps1MediaLayout.kt
          grep -q 'CUE_SET' app/src/main/java/com/omnicore/emulator/storage/Ps1MediaLayout.kt
          grep -q 'CCD_SET' app/src/main/java/com/omnicore/emulator/storage/Ps1MediaLayout.kt
          grep -q 'arquivo IMG correspondente não encontrado' app/src/main/java/com/omnicore/emulator/storage/Ps1MediaLayout.kt
          grep -q 'vários BIN sem CUE' app/src/main/java/com/omnicore/emulator/storage/Ps1MediaLayout.kt
          grep -q 'DESCRIPTOR_EXTENSIONS = setOf("cue", "ccd")' app/src/main/java/com/omnicore/emulator/core/ps1/Ps1Core.kt
          grep -q 'prepareCcdSession' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          grep -q 'validateCcdSession' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          grep -q 'Ps1MediaLayout.plan' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          grep -q 'importPs1Plan' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt
          grep -q 'Ps1MediaLayout.plan(docs)' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt
          grep -q 'CCD/IMG/SUB' app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt

      - name: Guard Compatibility 2.0 preflight and multi-disc gate
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/omnicore/emulator/storage/Ps1MediaPreflight.kt
          grep -q 'validateChd' app/src/main/java/com/omnicore/emulator/storage/Ps1MediaPreflight.kt
          grep -q 'validatePbp' app/src/main/java/com/omnicore/emulator/storage/Ps1MediaPreflight.kt
          grep -q 'DATA.PSAR' app/src/main/java/com/omnicore/emulator/storage/Ps1MediaPreflight.kt
          grep -q 'Ps1MediaPreflight.validate' app/src/main/java/com/omnicore/emulator/core/ps1/Ps1Core.kt
          test -f app/src/main/java/com/omnicore/emulator/storage/Ps1DiscManifest.kt
          grep -q 'parseM3u' app/src/main/java/com/omnicore/emulator/storage/Ps1DiscManifest.kt
          grep -q 'groupByDiscNumber' app/src/main/java/com/omnicore/emulator/storage/Ps1DiscManifest.kt
          grep -q 'not wired as a launchable format yet' app/src/main/java/com/omnicore/emulator/storage/Ps1DiscManifest.kt
          ! grep -q '"m3u"' app/src/main/java/com/omnicore/emulator/core/ps1/Ps1Core.kt

      - name: Guard native libretro disk-control bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'struct retro_disk_control_callback' app/src/main/cpp/libretro_abi.h
          grep -q 'struct retro_disk_control_ext_callback' app/src/main/cpp/libretro_abi.h
          grep -q 'requestDiskIndex' app/src/main/cpp/libretro_host.h
          grep -q 'nativeSetDiskIndex' app/src/main/cpp/native_bridge.cpp
          grep -q 'nativeDiskCount' app/src/main/java/com/omnicore/emulator/core/nativebridge/NativeBridge.kt
          grep -q 'fun diskState()' app/src/main/java/com/omnicore/emulator/core/nativebridge/NativeBridge.kt
          grep -q 'ps1_disk_control_patch.cmake' app/src/main/cpp/CMakeLists.txt
          cmake \
            -DOMNICORE_DISK_HOST_INPUT="$PWD/app/src/main/cpp/libretro_host_v7.cpp" \
            -DOMNICORE_DISK_HOST_OUTPUT="$RUNNER_TEMP/libretro_host_disk.cpp" \
            -P app/src/main/cpp/ps1_disk_control_patch.cmake
          grep -q 'applyPendingDiskRequest' "$RUNNER_TEMP/libretro_host_disk.cpp"
          grep -q 'RETRO_ENVIRONMENT_SET_DISK_CONTROL_EXT_INTERFACE' "$RUNNER_TEMP/libretro_host_disk.cpp"
          grep -q 'diskControlAvailable_' "$RUNNER_TEMP/libretro_host_disk.cpp"

      - name: Guard Quick Menu disk-control UI when applied
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'showDiskDialog' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt; then
            grep -q '"DISCO"' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
            grep -q 'NativeBridge.diskState()' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
            grep -q 'NativeBridge.setDiskIndex' app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          else
            test -f tools/patch_ps1_ui_disk.py
          fi

      - name: Guard physical Input 2.0 path
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'physicalTankAssist' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          grep -q 'resolveForGame(this, gameKey)' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          grep -q 'beginGesture(SystemClock.uptimeMillis())' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt
          grep -q 'PHYSICAL_TANK_FRAME_MS' app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt

      - name: Compile Kotlin sources
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          gradle :app:compileDebugKotlin --no-daemon --stacktrace
