name: PS1 Input 2.0 Source Patch

on:
  push:
    branches: [ "agent/ps1-input2-compat" ]
    paths:
      - "tools/apply_ps1_input2_foundation.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ps1-input2-compat
          fetch-depth: 0

      - name: Apply guarded PS1 Input 2.0 patch
        run: python3 tools/apply_ps1_input2_foundation.py

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "PS1 Input 2.0: add opt-in tank movement assist"
          git push origin HEAD:agent/ps1-input2-compat
