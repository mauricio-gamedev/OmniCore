name: PS1 M3U Source Patch Apply

on:
  push:
    branches: [ "agent/ps1-input2-compat" ]
    paths:
      - "tools/patch_ps1_m3u_runtime.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps1-m3u-source-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ps1-input2-compat
          fetch-depth: 0
      - name: Apply guarded M3U runtime/import patch
        run: python3 tools/patch_ps1_m3u_runtime.py
      - name: Commit generated source updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/omnicore/emulator/emulation/EmulationActivity.kt \
            app/src/main/java/com/omnicore/emulator/ui/OmniCoreV3App.kt
          git commit -m "Wire PS1 M3U multi-disc import and staging"
          git push origin HEAD:agent/ps1-input2-compat
