name: Publish PS1 Input 2.0 Test APK

on:
  push:
    branches: [ "agent/ps1-input2-compat" ]
    paths:
      - ".github/workflows/ps1-publish-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ps1-publish-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ps1-input2-compat
          fetch-depth: 0

      - name: Locate latest successful full APK build
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent%2Fps1-input2-compat&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "PS1 Input 2.0 Full APK Build") | .id' \
            | head -n1)"
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: no successful PS1 full APK build was found." >&2
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent%2Fps1-input2-compat&per_page=20" \
              --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha] | @tsv' || true
            exit 1
          fi
          echo "Using full-build run $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download validated APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          gh run download "${{ steps.locate.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name OmniCore-PS1-Input2-Compatibility2 \
            --dir build/release

          APK="build/release/OmniCore-PS1-Input2-Compatibility2-debug.apk"
          SHA_FILE="build/release/OmniCore-PS1-Input2-Compatibility2-debug.sha256"
          test -f "$APK"
          test -f "$SHA_FILE"

          EXPECTED_SHA="$(awk 'NR==1 {print $1}' "$SHA_FILE" | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          test "${#EXPECTED_SHA}" -eq 64
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: APK SHA-256 mismatch" >&2
            echo "expected: $EXPECTED_SHA" >&2
            echo "actual:   $ACTUAL_SHA" >&2
            exit 1
          fi
          echo "APK checksum verified: $ACTUAL_SHA"

      - name: Publish test release
        shell: bash
        run: |
          set -euo pipefail
          TAG="ps1-input2-compat-test"
          TITLE="OmniCore PS1 Input 2.0 + Compatibility 2.0 Test"
          NOTES="Test build from branch agent/ps1-input2-compat. Includes PS1 Input 2.0, conservative Smart Auto profiles, modern tank-control assist, physical-controller routing, Compatibility 2.0 media validation, CUE/CCD handling, M3U multi-disc support and in-game disk control. Built with the pinned PCSX-ReARMed core and the stable OmniCore DEV signing certificate."
          TARGET="$(git rev-parse HEAD)"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --target "$TARGET"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi

          gh release upload "$TAG" \
            build/release/OmniCore-PS1-Input2-Compatibility2-debug.apk \
            build/release/OmniCore-PS1-Input2-Compatibility2-debug.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Print release URL
        shell: bash
        run: |
          set -euo pipefail
          gh release view ps1-input2-compat-test \
            --repo "$GITHUB_REPOSITORY" \
            --json url \
            --jq '.url'
