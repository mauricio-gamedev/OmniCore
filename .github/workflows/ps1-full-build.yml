name: PS1 Input 2.0 Legacy APK Publisher — ARCHIVED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse legacy full APK publication
        run: |
          echo 'ARCHIVED: this branch was based on the older 0.9.4 line and must not publish installable OmniCore APKs.' >&2
          echo 'Use agent/recovery-0.11.5-full for recovery and re-port PS1 Input 2.0 onto the full 0.11.5 feature baseline before any new APK is published.' >&2
          exit 1
