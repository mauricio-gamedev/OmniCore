name: PS1 Input 2.0 Full APK Build

on:
  push:
    branches: [ "agent/ps1-input2-compat" ]
    paths:
      - ".github/workflows/ps1-full-build.yml"
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "tools/fetch_ps1_core.sh"
      - "tools/build_ps1_core_android.sh"
      - "config/omnicore-dev.keystore.b64"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps1-full-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ps1-input2-compat
          fetch-depth: 0

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          java -version
          gradle --version
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_NDK_HOME/ndk-build"
          test -x "$ANDROID_SDK_ROOT/cmake/3.31.5/bin/cmake"

      - name: Prepare stable DEV signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/signing
          base64 -d config/omnicore-dev.keystore.b64 > build/signing/omnicore-dev.jks
          chmod 600 build/signing/omnicore-dev.jks
          echo "OMNICORE_DEV_KEYSTORE=$GITHUB_WORKSPACE/build/signing/omnicore-dev.jks" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_STORE_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_ALIAS=omnicore-dev" >> "$GITHUB_ENV"
          echo "OMNICORE_DEV_KEY_PASSWORD=omnicore-dev-2026" >> "$GITHUB_ENV"
          keytool -list -keystore build/signing/omnicore-dev.jks -storepass omnicore-dev-2026 -alias omnicore-dev

      - name: Fetch pinned PCSX-ReARMed source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ps1_core.sh tools/build_ps1_core_android.sh
          ./tools/fetch_ps1_core.sh

      - name: Build PS1 core for Android ARM
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build_ps1_core_android.sh

      - name: Build full OmniCore debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK structure, manifest, signing and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          EXPECTED="9490d1ad4666312d6dd9e5b2a20699583919ae80a5536882bcd3f9accc793547"
          test -s "$APK"
          unzip -tqq "$APK"
          "$AAPT" dump badging "$APK" | tee build/apk-badging.txt
          grep -q "package: name='com.omnicore.emulator' versionCode='17' versionName='0.9.5-ps1-input2-r2'" build/apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED" || { echo "ERROR: unexpected DEV signing certificate: $ACTUAL" >&2; exit 1; }
          "$ZIPALIGN" -v -c -P 16 4 "$APK"

      - name: Package APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ps1-input2
          OUT="build/ps1-input2/OmniCore-v0.9.5-ps1-input2-r2.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          sha256sum "$OUT" > build/ps1-input2/OmniCore-v0.9.5-ps1-input2-r2.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniCore-v0.9.5-ps1-input2-r2
          path: |
            build/ps1-input2/OmniCore-v0.9.5-ps1-input2-r2.apk
            build/ps1-input2/OmniCore-v0.9.5-ps1-input2-r2.sha256
            build/apk-badging.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish fresh test release
        shell: bash
        run: |
          set -euo pipefail
          TAG="ps1-input2-0.9.5-r2-test"
          TITLE="OmniCore 0.9.5 PS1 Input 2.0 R2"
          NOTES="Fresh uniquely named APK to avoid stale browser/download-cache copies. CI validated ZIP integrity, AndroidManifest parsing, package com.omnicore.emulator, versionCode 17, stable OmniCore DEV signing certificate, APK signature and 16 KB alignment before publishing. Includes PS1 Input 2.0, Smart Auto, tank-control assist, Compatibility 2.0, CUE/CCD, M3U multi-disc and in-game disk control."
          APK="build/ps1-input2/OmniCore-v0.9.5-ps1-input2-r2.apk"
          HASH="build/ps1-input2/OmniCore-v0.9.5-ps1-input2-r2.sha256"
          TARGET="$(git rev-parse HEAD)"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease --target "$TARGET"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" "$APK" "$HASH" build/apk-badging.txt --repo "$GITHUB_REPOSITORY" --clobber
