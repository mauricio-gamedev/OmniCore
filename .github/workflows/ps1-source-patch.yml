name: PS1 Source Patch Apply

on:
  push:
    branches: [ "agent/ps1-input2-compat" ]
    paths:
      - "tools/patch_ps1_ui_disk.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps1-source-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ps1-input2-compat
          fetch-depth: 0
      - name: Apply guarded PS1 UI disk patch
        run: python3 tools/patch_ps1_ui_disk.py
      - name: Commit generated source update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/omnicore/emulator/emulation/GamepadOverlayView.kt
          git commit -m "Wire PS1 disk switch into Quick Menu"
          git push origin HEAD:agent/ps1-input2-compat
